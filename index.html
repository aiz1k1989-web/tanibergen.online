<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TANIBERGEN - Photographic Archive</title>
  <meta name="description" content="A personal photographic archive by Aizat Tanibergen.">
  <meta name="theme-color" content="#f4f3ef">
    <link rel="stylesheet" href="index-main.css?v=20261120-white-room-01">
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <button type="button" class="brand-btn" id="brand-reset" aria-label="tanibergen.online - Return to the archive">
        <span class="brand-name">tanibergen.online</span>
      </button>

      <nav class="mode-nav" aria-label="View mode">
        <button type="button" class="mode-btn is-active" data-view="sequence" aria-pressed="true">All</button>
        <button type="button" class="mode-btn" data-view="contact" aria-pressed="false">Contact</button>
        <button type="button" class="mode-btn" data-view="blog" aria-pressed="false">Journal</button>
        <button type="button" class="mode-btn" id="info-toggle" aria-expanded="false" aria-controls="info-drawer">Info</button>
      </nav>
    </div>
  </header>

  <div class="mobile-series-bar" aria-label="Series filter">
    <div class="mobile-series-scroll" id="mobile-series-list"></div>
    <div class="mobile-counter" id="mobile-counter" aria-live="polite">01 / 01</div>
  </div>

  <div class="workspace">
    <aside class="rail" aria-label="Archive navigation">
      <div class="rail-sticky">
        <div class="rail-block">
          <div class="rail-label">Plate</div>
          <div class="rail-counter" id="rail-counter" aria-live="polite">01 / 01</div>
          <div class="rail-progress" aria-hidden="true">
            <div class="rail-progress-fill" id="rail-progress-fill"></div>
          </div>
        </div>

        <div class="rail-block">
          <div class="rail-label">Unsorted records</div>
          <ul class="series-list" id="desktop-series-list"></ul>
        </div>

        <div class="rail-block rail-footer">
          <a class="rail-link" id="rail-instagram" href="https://instagram.com/isaac_4u" target="_blank" rel="noopener noreferrer">@isaac_4u</a>
          <span class="rail-domain" id="rail-domain">tanibergen.online</span>
        </div>
      </div>
    </aside>

    <main id="main-stage" class="stage" tabindex="-1">
      <section id="sequence-view" class="sequence-view" aria-label="Photograph sequence"></section>
      <section id="contact-view" class="contact-view" aria-label="Contact details" hidden></section>
      <section id="color-view" class="color-view" aria-label="Color-organized photo archive" hidden></section>
      <section id="blog-view" class="blog-view" aria-label="Journal" hidden></section>
    </main>
  </div>

  <footer class="site-footer">
    <a class="github-credit" href="https://github.com/aiz1k1989-web/tanibergen.online" target="_blank" rel="noopener noreferrer" aria-label="Built with GitHub - view source code">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.67-3.75-1.31-3.75-1.31-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 .1.2 2.09 3.3 1.59.1-.74.39-1.25.7-1.54-2.47-.28-5.07-1.24-5.07-5.51 0-1.22.44-2.22 1.16-3-.12-.29-.5-1.45.11-3.02 0 0 .95-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.1-1.45 3.05-1.15 3.05-1.15.61 1.57.23 2.73.11 3.02.72.78 1.16 1.78 1.16 3 0 4.28-2.6 5.23-5.08 5.5.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
      <span>Built with GitHub</span>
    </a>
  </footer>

  <aside id="info-drawer" class="info-drawer" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
    <div class="info-backdrop" data-close-info></div>
    <div class="info-panel">
      <div class="info-top">
        <span class="mono-label">Index / Colophon</span>
        <button type="button" class="text-btn" id="info-close" aria-label="Close info panel">Close [Esc]</button>
      </div>
      <div class="info-body">
        <h1 class="info-title" id="info-title">TANIBERGEN</h1>
        <figure class="about-photo"><img src="previews/1/1.webp" alt="Photograph from the archive" loading="lazy" decoding="async"></figure>
        <p class="info-statement" id="info-statement"></p>
        <dl class="info-meta">
          <div class="info-row">
            <dt>Instagram</dt>
            <dd><a id="info-instagram" href="https://instagram.com/isaac_4u" target="_blank" rel="noopener noreferrer">@isaac_4u</a></dd>
          </div>

        </dl>
      </div>
    </div>
  </aside>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photograph viewer" hidden>
    <div class="lb-topbar">
      <div class="lb-counter" id="lb-counter">01 / 01</div>
      <button type="button" class="lb-close" id="lb-close" aria-label="Close fullscreen viewer">Close [Esc]</button>
    </div>

    <div class="lb-stage" id="lb-stage">
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photograph">
        <span aria-hidden="true">&larr;</span>
      </button>

      <figure class="lb-figure" id="lb-figure">
        <div class="lb-media-wrap" id="lb-media-wrap"></div>
        <figcaption class="lb-caption" id="lb-caption"></figcaption>
      </figure>

      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photograph">
        <span aria-hidden="true">&rarr;</span>
      </button>
    </div>

    <div class="lb-mobile-controls">
      <button type="button" class="lb-m-btn" id="lb-m-prev" aria-label="Previous photograph">&larr; Prev</button>
      <button type="button" class="lb-m-btn" id="lb-m-next" aria-label="Next photograph">Next &rarr;</button>
    </div>
  </div>

    <section id="owner-report" class="owner-report" role="dialog" aria-modal="true" aria-labelledby="owner-report-title" hidden>
    <div class="owner-report-backdrop"></div>
    <div class="owner-report-panel">
      <div class="owner-report-head">
        <span class="mono-label" id="owner-report-title">Private / Site report</span>
        <button type="button" class="text-btn" id="owner-report-close">Close [Esc]</button>
      </div>
      <p>Write a note for the next site update.</p>
      <textarea id="owner-report-text" rows="6" placeholder="Describe the change or issue..."></textarea>
      <button type="button" class="owner-report-send" id="owner-report-send">OPEN PRIVATE REPORT ↗</button>
    </div>
  </section>

  <script src="index-main-works.js?v=20261120-mobile-previews-01" defer></script>
  <script src="index-main.js?v=20261120-mobile-previews-01" defer></script>
</body>
</html>
