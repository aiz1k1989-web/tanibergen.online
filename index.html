<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Photographs by Tanibergen.">
  <title>TANIBERGEN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="name" href="./">TANIBERGEN</a>
    <span class="header-meta">PHOTOGRAPHS <span class="count" id="photoCount"></span></span>
  </header>

  <main>
    <section class="gallery" id="gallery" aria-label="Photographs"></section>
  </main>

  <footer class="footer">
    <span>TANIBERGEN</span>
    <span id="footerCount"></span>
  </footer>

  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close" id="closeViewer" type="button" aria-label="Close image">CLOSE</button>
    <button class="viewer-prev" id="prevImage" type="button" aria-label="Previous image">←</button>
    <img id="viewerImage" alt="">
    <button class="viewer-next" id="nextImage" type="button" aria-label="Next image">→</button>
    <span class="viewer-index" id="viewerIndex"></span>
  </div>

  <script src="works.js"></script>
  <script src="app.js"></script>
</body>
</html>
