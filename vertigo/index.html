<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VERTIGO — Tanibergen</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}body{overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}#stage{position:fixed;inset:0;overflow:hidden;background:#050505;isolation:isolate}.scene{position:absolute;inset:0;overflow:visible;transform-origin:0 0;will-change:transform}.photo{position:absolute;display:block;max-width:none;object-fit:contain;user-select:none;-webkit-user-drag:none}.portal{position:absolute;overflow:hidden;background:#050505;will-change:left,top,width,height}.portal>.photo{inset:0;width:100%;height:100%}@media(prefers-reduced-motion:reduce){.scene,.portal{will-change:auto}}</style></head>
<body><main id="stage" aria-label="A continuous photographic zoom"></main><script>
(()=>{'use strict';const TOTAL=98,stage=document.querySelector('#stage'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const paths=[];[20,20,20,20,18].forEach((n,g)=>{for(let i=1;i<=n;i++)paths.push('../photos/'+(g+1)+'/'+i+'.webp')});let transitions=Array.from({length:TOTAL},(_,i)=>({from:i+1,to:i+2,x:50,y:50,w:9.2}));let index=0,locked=false,debt=0,touchY=0,root=null,portal=null,rootRect=null;const cache=new Map(),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function image(n){n=(n%TOTAL+TOTAL)%TOTAL;if(cache.has(n))return cache.get(n);const p=new Promise(resolve=>{const im=new Image();im.decoding='async';im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=paths[n]});cache.set(n,p);return p}
function fit(im){const W=innerWidth,H=innerHeight,pad=Math.min(W,H)*.012,r=im.naturalWidth/im.naturalHeight;let w=W-pad*2,h=w/r;if(h>H-pad*2){h=H-pad*2;w=h*r}return{x:(W-w)/2,y:(H-h)/2,w,h}}
function makeScene(im,n){const s=document.createElement('div');s.className='scene';s.dataset.frame=n+1;const pic=document.createElement('img');pic.className='photo';pic.alt='';pic.draggable=false;pic.src=paths[n];const r=fit(im);Object.assign(pic.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});s.append(pic);return{s,r}}
function anchor(rect,ratio,t){const frac=clamp((+t.w||9.2)/100,.045,.13);let w=rect.w*frac,h=w/ratio;if(h>rect.h*.22){h=rect.h*.22;w=h*ratio}const cx=rect.x+rect.w*clamp((+t.x||50)/100,.08,.92),cy=rect.y+rect.h*clamp((+t.y||50)/100,.08,.92);return{x:clamp(cx-w/2,rect.x+1,rect.x+rect.w-w-1),y:clamp(cy-h/2,rect.y+1,rect.y+rect.h-h-1),w,h}}
async function addPortal(scene,rect,n){const im=await image(n);if(!im)return null;const t=transitions[index]||{},a=anchor(rect,im.naturalWidth/im.naturalHeight,t),p=document.createElement('div');p.className='portal';Object.assign(p.style,{left:a.x+'px',top:a.y+'px',width:a.w+'px',height:a.h+'px'});const pic=document.createElement('img');pic.className='photo';pic.alt='';pic.draggable=false;pic.src=paths[n];p.append(pic);scene.append(p);return{el:p,rect:a,im,n}}
async function start(){try{const r=await fetch('./positions.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(Array.isArray(d.transitions)&&d.transitions.length===TOTAL)transitions=d.transitions}}catch{}const im=await image(0);if(!im)return;const first=makeScene(im,0);root=first.s;rootRect=first.r;stage.append(root);portal=await addPortal(root,rootRect,1);image(2)}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}function animate(el,from,to,duration){return new Promise(done=>{const start=performance.now();function tick(now){const p=reduced?1:clamp((now-start)/duration,0,1),e=ease(p);el.style.left=(from.x+(to.x-from.x)*e)+'px';el.style.top=(from.y+(to.y-from.y)*e)+'px';el.style.width=(from.w+(to.w-from.w)*e)+'px';el.style.height=(from.h+(to.h-from.h)*e)+'px';if(p<1)requestAnimationFrame(tick);else done()}requestAnimationFrame(tick)})}
async function advance(){if(locked||!portal)return;locked=true;const oldPortal=portal,nextScene=makeScene(oldPortal.im,oldPortal.n);nextScene.s.style.zIndex='1';stage.append(nextScene.s);root.style.zIndex='2';const a=oldPortal.rect,dx=a.x-rootRect.x,dy=a.y-rootRect.y,sx=a.w/rootRect.w,sy=a.h/rootRect.h,b={x:-dx/sx,y:-dy/sy,w:innerWidth/sx,h:innerHeight/sy},start=performance.now(),duration=reduced?1:1150;await Promise.all([new Promise(resolve=>{function tick(now){const p=reduced?1:clamp((now-start)/duration,0,1),e=ease(p);root.style.transform='translate('+dx*e+'px,'+dy*e+'px) scale('+(1+(sx-1)*e)+','+(1+(sy-1)*e)+')';if(p<1)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)}),animate(oldPortal.el,a,b,duration)]);stage.replaceChildren(nextScene.s);root=nextScene.s;root.style.transform='none';rootRect=nextScene.r;index=oldPortal.n;portal=await addPortal(root,rootRect,(index+1)%TOTAL);image(index+2);locked=false}
stage.addEventListener('wheel',e=>{e.preventDefault();if(e.deltaY<0)return;debt+=Math.min(e.deltaY,120);if(debt>55){debt=0;advance()}},{passive:false});stage.addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});stage.addEventListener('touchend',e=>{if(touchY-e.changedTouches[0].clientY>32)advance()},{passive:true});addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();advance()}});addEventListener('resize',()=>{if(!locked)location.reload()},{passive:true});start()})();
</script></body></html>
