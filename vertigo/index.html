<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>VERTIGO / tanibergen.online</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
body{overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#050505;isolation:isolate;touch-action:none}
.art{position:absolute;overflow:visible;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
.art-base{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.nested-frame{position:absolute;overflow:hidden;background:#050505;box-shadow:0 1px 10px rgba(0,0,0,.12);contain:layout paint}
.nested-frame>.art{position:relative;left:0!important;top:0!important;width:100%!important;height:100%!important;transform:none!important}
@media(prefers-reduced-motion:reduce){.art{will-change:auto}}
</style>
</head>
<body>
<main id="stage" aria-label="VERTIGO photographic sequence"></main>
<script>
(() => {
'use strict';

const TOTAL=98;
const stage=document.getElementById('stage');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const imagePaths=[];
[20,20,20,20,18].forEach((count,group)=>{
  for(let number=1;number<=count;number++)imagePaths.push('../photos/'+(group+1)+'/'+number+'.webp');
});

let index=0;
let busy=false;
let queued=0;
let wheelDebt=0;
let touchStartY=0;
let currentArt=null;
let currentRect=null;
let currentRatio=1;
let currentDepth=1;
let transitions=Array.from({length:TOTAL},(_,i)=>({from:i+1,to:(i+1)%TOTAL+1,x:50,y:50,w:9.2}));
const imageCache=new Map();
const MAX_DEPTH=18;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mod=(n,m)=>(n%m+m)%m;

function imageAt(i,priority=false){
  const key=mod(i,TOTAL);
  if(imageCache.has(key))return imageCache.get(key);
  const promise=new Promise(resolve=>{
    const img=new Image();
    img.decoding='async';
    if(priority)img.fetchPriority='high';
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=imagePaths[key];
  });
  imageCache.set(key,promise);
  return promise;
}

function fitImage(img){
  const sw=stage.clientWidth,sh=stage.clientHeight;
  const margin=clamp(Math.min(sw,sh)*.018,8,22);
  const maxW=Math.max(1,sw-margin*2),maxH=Math.max(1,sh-margin*2);
  const ratio=img.naturalWidth/img.naturalHeight;
  let width=maxW,height=width/ratio;
  if(height>maxH){height=maxH;width=height*ratio}
  return {left:(sw-width)/2,top:(sh-height)/2,width,height};
}

function makeArt(img,i){
  const art=document.createElement('div');
  art.className='art';
  art.dataset.frame=String(i+1);
  art.style.aspectRatio=img.naturalWidth+'/'+img.naturalHeight;
  const base=document.createElement('img');
  base.className='art-base';
  base.alt='';
  base.draggable=false;
  base.src=imagePaths[mod(i,TOTAL)];
  art.appendChild(base);
  return art;
}

function targetSlot(parentRect,childRatio,transition){
  const wFraction=clamp((Number(transition?.w)||9.2)/100,.075,.105);
  let width=parentRect.width*wFraction;
  let height=width/childRatio;
  const maxHeight=parentRect.height*.19;
  if(height>maxHeight){height=maxHeight;width=height*childRatio}
  const cx=parentRect.left+parentRect.width*clamp((Number(transition?.x)||50)/100,.08,.92);
  const cy=parentRect.top+parentRect.height*clamp((Number(transition?.y)||50)/100,.08,.92);
  const left=clamp(cx-width/2,parentRect.left+1,parentRect.left+parentRect.width-width-1);
  const top=clamp(cy-height/2,parentRect.top+1,parentRect.top+parentRect.height-height-1);
  return {left,top,width,height};
}

function makeNestedFrame(parentArt,parentRect,slotRect){
  const frame=document.createElement('div');
  frame.className='nested-frame';
  const left=(slotRect.left-parentRect.left)/parentRect.width*100;
  const top=(slotRect.top-parentRect.top)/parentRect.height*100;
  const width=slotRect.width/parentRect.width*100;
  const height=slotRect.height/parentRect.height*100;
  frame.style.left=left+'%';
  frame.style.top=top+'%';
  frame.style.width=width+'%';
  frame.style.height=height+'%';
  parentArt.appendChild(frame);
  return frame;
}

function mountInitial(img){
  currentArt=makeArt(img,0);
  currentRect=fitImage(img);
  currentRatio=img.naturalWidth/img.naturalHeight;
  currentDepth=1;
  Object.assign(currentArt.style,{
    left:currentRect.left+'px',
    top:currentRect.top+'px',
    width:currentRect.width+'px',
    height:currentRect.height+'px',
    zIndex:'2'
  });
  stage.replaceChildren(currentArt);
}

function easing(t){
  return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}

function stepped(t,steps){
  const v=easing(clamp(t,0,1));
  return Math.floor(v*steps)/steps;
}

function animateRetreat(art,from,to,duration){
  return new Promise(resolve=>{
    const start=performance.now();
    const dx=to.left-from.left;
    const dy=to.top-from.top;
    const scale=to.width/from.width;
    const steps=reduced?1:12;
    function tick(now){
      const t=reduced?1:clamp((now-start)/duration,0,1);
      const p=t>=1?1:stepped(t,steps);
      art.style.transform='translate3d('+(dx*p)+'px,'+(dy*p)+'px,0) scale('+(1+(scale-1)*p)+')';
      if(t<1)requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });
}

function pruneDeepest(art,depth){
  if(depth>=MAX_DEPTH)return;
  const frame=art.querySelector(':scope > .nested-frame');
  if(!frame)return;
  const child=frame.querySelector(':scope > .art');
  if(child)pruneDeepest(child,depth+1);
}
function trimHistory(art,depth){
  if(depth<MAX_DEPTH)return;
  let node=art;
  while(true){
    const frame=node.querySelector(':scope > .nested-frame');
    if(!frame)return;
    const child=frame.querySelector(':scope > .art');
    if(!child){frame.remove();return}
    const next=child.querySelector(':scope > .nested-frame');
    if(!next){frame.remove();return}
    node=child;
  }
}

async function advance(){
  const from=index;
  const to=mod(index+1,TOTAL);
  const [parentImg]=await Promise.all([imageAt(to,true)]);
  if(!parentImg)return;

  const parentRect=fitImage(parentImg);
  const parentRatio=parentImg.naturalWidth/parentImg.naturalHeight;
  const slot=targetSlot(parentRect,currentRatio,transitions[from]);
  const nextArt=makeArt(parentImg,to);
  Object.assign(nextArt.style,{
    left:parentRect.left+'px',
    top:parentRect.top+'px',
    width:parentRect.width+'px',
    height:parentRect.height+'px',
    zIndex:'1'
  });

  stage.appendChild(nextArt);
  currentArt.style.zIndex='3';
  currentArt.style.transform='none';

  const dx=slot.left-currentRect.left;
  const dy=slot.top-currentRect.top;
  const distance=Math.hypot(dx,dy);
  const ratioChange=Math.abs(Math.log(parentRatio/currentRatio));
  const duration=reduced?1:Math.round(820+Math.min(180,ratioChange*95)+(from%3)*22);

  await animateRetreat(currentArt,currentRect,slot,duration);

  const frame=makeNestedFrame(nextArt,parentRect,slot);
  currentArt.style.transform='none';
  Object.assign(currentArt.style,{
    position:'relative',
    left:'0',
    top:'0',
    width:'100%',
    height:'100%',
    zIndex:'auto'
  });
  frame.appendChild(currentArt);

  stage.replaceChildren(nextArt);
  currentArt=nextArt;
  currentRect=parentRect;
  currentRatio=parentRatio;
  currentDepth++;
  if(currentDepth>MAX_DEPTH){
    trimHistory(currentArt,1);
    currentDepth=MAX_DEPTH;
  }
  index=to;
  for(const key of imageCache.keys())if(key!==index&&key!==mod(index+1,TOTAL))imageCache.delete(key);
  imageAt(index+1);
}

async function pump(){
  if(busy||queued===0)return;
  busy=true;
  queued--;
  try{await advance()}catch(error){}
  busy=false;
  if(queued>0)pump();
}
function requestAdvance(){
  queued=clamp(queued+1,0,1);
  pump();
}

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  let delta=e.deltaY;
  if(e.deltaMode===1)delta*=16;
  if(e.deltaMode===2)delta*=stage.clientHeight;
  if(delta<=0)return;
  wheelDebt+=Math.min(delta,120);
  if(wheelDebt>=70){wheelDebt=0;requestAdvance()}
},{passive:false});

stage.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{
  const delta=touchStartY-e.changedTouches[0].clientY;
  if(delta>34)requestAdvance();
},{passive:true});

window.addEventListener('keydown',e=>{
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();requestAdvance()}
});

async function init(){
  try{
    const response=await fetch('./positions.json',{cache:'no-store'});
    if(response.ok){
      const data=await response.json();
      if(Array.isArray(data.transitions)&&data.transitions.length===TOTAL)transitions=data.transitions;
    }
  }catch(error){}
  const first=await imageAt(0,true);
  if(first)mountInitial(first);
}
function resize(){
  if(busy||!currentArt)return;
  const img=currentArt.querySelector(':scope > .art-base');
  if(!img||!img.naturalWidth)return;
  const r=fitImage(img);
  currentRect=r;
  Object.assign(currentArt.style,{
    left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'
  });
}
window.addEventListener('resize',resize,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize,{passive:true});

init();
})();
</script>
</body>
</html>
