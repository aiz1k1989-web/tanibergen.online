<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>VERTIGO / tanibergen.online</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
body{overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#050505;isolation:isolate;touch-action:none}
.scene{position:absolute;inset:0;overflow:hidden;background:#050505;contain:layout paint style}
.photo,.portal{position:absolute;display:block;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
.photo{object-fit:contain;max-width:none;max-height:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.portal{overflow:hidden;background:#050505}
.portal img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
@media(prefers-reduced-motion:reduce){.photo,.portal{will-change:auto}}
</style>
</head>
<body>
<main id="stage" aria-label="VERTIGO photographic sequence"><div class="scene" id="scene"></div></main>
<script>
(() => {
'use strict';

const TOTAL=98;
const stage=document.getElementById('stage');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const imagePaths=[];
[20,20,20,20,18].forEach((count,group)=>{
  for(let number=1;number<=count;number++) imagePaths.push('../photos/'+(group+1)+'/'+number+'.webp');
});

let scene=document.getElementById('scene');
let index=0;
let busy=false;
let queue=0;
let wheelBucket=0;
let touchStartY=0;
let transitions=Array.from({length:TOTAL},(_,i)=>({
  from:i+1,to:(i+1)%TOTAL+1,x:50,y:50,w:10
}));

const imageCache=new Map();


const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const mod=(n,m)=>(n%m+m)%m;

function stageRect(){
  const r=stage.getBoundingClientRect();
  return {left:0,top:0,width:r.width,height:r.height};
}

function fitImage(img){
  const sw=stage.clientWidth,sh=stage.clientHeight;
  const margin=clamp(Math.min(sw,sh)*.018,8,22);
  const maxW=Math.max(1,sw-margin*2),maxH=Math.max(1,sh-margin*2);
  const ratio=img.naturalWidth/img.naturalHeight;
  let width=maxW,height=width/ratio;
  if(height>maxH){height=maxH;width=height*ratio}
  return {left:(sw-width)/2,top:(sh-height)/2,width,height};
}

function getImage(i,priority){
  const key=mod(i,TOTAL);
  if(imageCache.has(key))return imageCache.get(key);
  const promise=new Promise(resolve=>{
    const img=new Image();
    img.decoding='async';
    if(priority)img.fetchPriority='high';
    img.onload=()=>{if(img.decode)img.decode().catch(()=>{}).finally(()=>resolve(img));else resolve(img)};
    img.onerror=()=>resolve(null);
    img.src=imagePaths[key];
  });
  imageCache.set(key,promise);
  return promise;
}

function trimCache(){
  const keep=new Set([mod(index-1,TOTAL),index,mod(index+1,TOTAL),mod(index+2,TOTAL)]);
  for(const key of imageCache.keys())if(!keep.has(key))imageCache.delete(key);
}

function getPortalRect(img,nextImg,i,parentRect){
  const cfg=transitions[i]||{};
  const nextRatio=nextImg.naturalWidth/nextImg.naturalHeight;
  const requested=clamp((Number(cfg.w)||9.2)/100,.078,.102);
  let width=parentRect.width*requested;
  let height=width/nextRatio;
  const maxHeight=parentRect.height*.17;
  if(height>maxHeight){height=maxHeight;width=height*nextRatio}
  const centerX=parentRect.left+parentRect.width*clamp((Number(cfg.x)||50)/100,.12,.88);
  const centerY=parentRect.top+parentRect.height*clamp((Number(cfg.y)||50)/100,.12,.88);
  const left=clamp(centerX-width/2,parentRect.left+2,parentRect.left+parentRect.width-width-2);
  const top=clamp(centerY-height/2,parentRect.top+2,parentRect.top+parentRect.height-height-2);
  return {left,top,width,height};
}
function fitInside(parentRect,slotRect){
  const scale=Math.min(slotRect.width/parentRect.width,slotRect.height/parentRect.height);
  const width=parentRect.width*scale;
  const height=parentRect.height*scale;
  return {
    left:slotRect.left+(slotRect.width-width)/2,
    top:slotRect.top+(slotRect.height-height)/2,
    width,height
  };
}

function addRectStyles(el,rect){
  el.style.left=rect.left+'px';
  el.style.top=rect.top+'px';
  el.style.width=rect.width+'px';
  el.style.height=rect.height+'px';
}

function makeScene(i,img,nextImg){
  const holder=document.createElement('div');
  holder.className='scene';
  const parentRect=fitImage(img);
  const photo=document.createElement('img');
  photo.className='photo';
  photo.alt='';
  photo.draggable=false;
  photo.src=imagePaths[mod(i,TOTAL)];
  addRectStyles(photo,parentRect);
  holder.appendChild(photo);

  let slotRect=null;
  if(nextImg){
    slotRect=getPortalRect(img,nextImg,i,parentRect);
    const portal=document.createElement('div');
    portal.className='portal';
    addRectStyles(portal,slotRect);
    const inner=document.createElement('img');
    inner.alt='';
    inner.draggable=false;
    inner.src=imagePaths[mod(i+1,TOTAL)];
    portal.appendChild(inner);
    holder.appendChild(portal);
  }
  return {node:holder,photo,portal:holder.querySelector('.portal'),parentRect,slotRect};
}

function transformBetween(baseRect,visualRect){
  const scale=visualRect.width/baseRect.width;
  const tx=visualRect.left-baseRect.left;
  const ty=visualRect.top-baseRect.top;
  return 'translate3d('+tx+'px,'+ty+'px,0) scale('+scale+')';
}

function stutterProgress(t,beats,hold){
  if(t<=0)return 0;
  if(t>=1)return 1;
  const phase=t*beats;
  const step=Math.floor(phase);
  const local=phase-step;
  const moving=1-hold;
  const p=smooth(clamp(local/moving,0,1));
  return (step+p)/beats;
}

function interpolateVisual(from,to,p,base,arc){
  const dx=(to.left-from.left),dy=(to.top-from.top);
  const distance=Math.hypot(dx,dy);
  const wave=Math.sin(Math.PI*p)*arc;
  const px=distance?(-dy/distance)*wave:0;
  const py=distance?(dx/distance)*wave:0;
  return {
    left:lerp(from.left,to.left,p)+px,
    top:lerp(from.top,to.top,p)+py,
    width:lerp(from.width,to.width,p),
    height:lerp(from.height,to.height,p)
  };
}

function animateVisual(el,baseRect,fromRect,toRect,duration,delay,beats,arc){
  return new Promise(resolve=>{
    const start=performance.now()+delay;
    const frame=now=>{
      if(now<start){requestAnimationFrame(frame);return}
      const t=clamp((now-start)/duration,0,1);
      const p=reduced?1:stutterProgress(t,beats,.13);
      const visual=interpolateVisual(fromRect,toRect,p,baseRect,arc);
      el.style.transform=transformBetween(baseRect,visual);
      if(t<1)requestAnimationFrame(frame);
      else{el.style.transform=transformBetween(baseRect,toRect);resolve()}
    };
    requestAnimationFrame(frame);
  });
}

function commitScene(newIndex,img,nextImg){
  const fresh=makeScene(newIndex,img,nextImg);
  stage.replaceChildren(fresh.node);
  scene=fresh.node;
  index=newIndex;
  trimCache();
  getImage(index+1);
  getImage(index+2);
}

async function transitionForward(){
  const from=index,to=mod(index+1,TOTAL);
  const current=await getImage(from,true);
  const next=await getImage(to,true);
  const followingPromise=getImage(to+1);
  if(!current||!next)return;
  if(!scene.querySelector('.portal')){
    const ready=makeScene(from,current,next);
    stage.replaceChildren(ready.node);scene=ready.node;
  }
  const photo=scene.querySelector('.photo');
  const portal=scene.querySelector('.portal');
  if(!photo||!portal)return;
  const parentRect=fitImage(current);
  const slotRect=getPortalRect(current,next,from,parentRect);
  const nextRect=fitImage(next);
  const reducedDuration=reduced?1:760;
  const insideRect=fitInside(parentRect,slotRect);
  const distance=Math.hypot(
    (parentRect.left+parentRect.width/2)-(insideRect.left+insideRect.width/2),
    (parentRect.top+parentRect.height/2)-(insideRect.top+insideRect.height/2)
  );
  await Promise.all([
    animateVisual(photo,parentRect,parentRect,insideRect,reducedDuration,0,reduced?1:6,Math.min(10,distance*.018)),
    animateVisual(portal,slotRect,slotRect,nextRect,reducedDuration*.91,reduced?0:95,reduced?1:7,Math.min(12,Math.hypot(slotRect.left-nextRect.left,slotRect.top-nextRect.top)*.012))
  ]);
  const following=await followingPromise;
  commitScene(to,next,following);
}

async function transitionBackward(){
  const from=index,to=mod(index-1,TOTAL),before=mod(to-1,TOTAL);
  const previous=await getImage(to,true);
  const current=await getImage(from,true);
  const beforePreviousPromise=getImage(before);
  if(!previous||!current)return;

  const reverseScene=makeScene(to,previous,current);
  const parentRect=reverseScene.parentRect;
  const slotRect=reverseScene.slotRect;
  const currentRect=fitImage(current);
  const insideRect=fitInside(parentRect,slotRect);

  reverseScene.photo.style.transform=transformBetween(parentRect,insideRect);
  reverseScene.portal.style.transform=transformBetween(slotRect,currentRect);
  stage.replaceChildren(reverseScene.node);
  scene=reverseScene.node;

  const distance=Math.hypot(
    (parentRect.left+parentRect.width/2)-(insideRect.left+insideRect.width/2),
    (parentRect.top+parentRect.height/2)-(insideRect.top+insideRect.height/2)
  );
  await Promise.all([
    animateVisual(reverseScene.photo,parentRect,insideRect,parentRect,reduced?1:760,0,reduced?1:6,Math.min(10,distance*.018)),
    animateVisual(reverseScene.portal,slotRect,currentRect,slotRect,reduced?1:690,reduced?0:70,reduced?1:7,Math.min(12,Math.hypot(currentRect.left-slotRect.left,currentRect.top-slotRect.top)*.012))
  ]);
  const beforePrevious=await beforePreviousPromise;
  commitScene(to,previous,beforePrevious);
}

async function pump(){
  if(busy||queue===0)return;
  busy=true;
  const direction=Math.sign(queue);
  queue-=direction;
  try{
    if(direction>0)await transitionForward();
    else await transitionBackward();
  }catch(error){}
  busy=false;
  trimCache();
  if(queue!==0)pump();
}

function requestStep(direction){
  if(direction>0)queue=clamp(queue+1,0,2);
  else queue=clamp(queue-1,-2,0);
  pump();
}

function onWheel(e){
  e.preventDefault();
  const raw=e.deltaMode===1?e.deltaY*16:(e.deltaMode===2?e.deltaY*stage.clientHeight:e.deltaY);
  if(Math.abs(raw)<.1)return;
  wheelBucket+=clamp(raw,-120,120);
  if(wheelBucket>=64){wheelBucket=0;requestStep(1)}
  else if(wheelBucket<=-64){wheelBucket=0;requestStep(-1)}
}

stage.addEventListener('wheel',onWheel,{passive:false});
stage.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{
  const delta=touchStartY-e.changedTouches[0].clientY;
  if(delta>34)requestStep(1);
  else if(delta< -34)requestStep(-1);
},{passive:true});

window.addEventListener('keydown',e=>{
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();requestStep(1)}
  else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();requestStep(-1)}
});

async function init(){
  try{
    const response=await fetch('./positions.json',{cache:'no-store'});
    if(response.ok){
      const data=await response.json();
      if(Array.isArray(data.transitions)&&data.transitions.length===TOTAL)transitions=data.transitions;
    }
  }catch(error){}
  const first=await getImage(0,true);
  const second=await getImage(1,true);
  if(!first)return;
  const initial=makeScene(0,first,second);
  stage.replaceChildren(initial.node);
  scene=initial.node;
  getImage(2);
  trimCache();
}

let resizeTimer=0;
function handleResize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(async()=>{
    if(busy)return;
    const current=await getImage(index);
    const next=await getImage(index+1);
    if(!current)return;
    const fresh=makeScene(index,current,next);
    stage.replaceChildren(fresh.node);
    scene=fresh.node;
  },120);
}
window.addEventListener('resize',handleResize,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',handleResize,{passive:true});

init();
})();
</script>
</body>
</html>
