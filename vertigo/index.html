<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="VERTIGO - a photographic zoom sequence by Aizat Tanibergen.">
<title>VERTIGO / tanibergen.online</title>
<style>
:root{color-scheme:dark;--bg:#050505;--fg:#eee}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body{overscroll-behavior:none;touch-action:pan-y}
.top{position:fixed;z-index:10;top:0;left:0;right:0;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.top a{color:inherit;text-decoration:none;pointer-events:auto}.top span{color:#999}
.stage{position:fixed;inset:0;overflow:hidden;background:#050505;isolation:isolate}
.frame{position:absolute;inset:0;overflow:hidden;will-change:left,top,width,height;transform:translateZ(0);background:#050505}
.frame img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.frame.current{z-index:2}.frame.next{z-index:1;opacity:1}
.frame.current.is-shrinking{z-index:3}
.hud{position:fixed;z-index:9;left:24px;right:24px;bottom:22px;display:flex;align-items:center;gap:16px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#aaa;pointer-events:none}
.track{height:1px;background:#333;flex:1;overflow:hidden}.track i{display:block;height:100%;width:1%;background:#ddd;transition:width .25s linear}
.counter{min-width:66px;text-align:right;color:#eee;font-variant-numeric:tabular-nums}
.hint{position:fixed;z-index:9;left:50%;bottom:54px;transform:translateX(-50%);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#666;white-space:nowrap;pointer-events:none}
.start{position:fixed;z-index:8;inset:0;display:grid;place-items:center;background:#050505;transition:opacity .45s ease,visibility .45s}
.start.hidden{opacity:0;visibility:hidden;pointer-events:none}
.start button{appearance:none;border:1px solid #444;background:transparent;color:#eee;padding:15px 22px;font:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.start button:focus-visible{outline:1px solid white;outline-offset:5px}
@media(max-width:600px){.top{padding:17px 16px}.hud{left:16px;right:16px;bottom:17px}.hint{bottom:47px}}
@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>
<body>
<header class="top"><a href="../">tanibergen.online</a><span>VERTIGO / 01-98</span></header>
<main class="stage" id="stage" aria-label="Vertigo photographic sequence">
  <div class="frame next" id="next"><img id="nextImage" alt="" decoding="async"></div>
  <div class="frame current" id="current"><img id="currentImage" alt="Photograph in the Vertigo sequence" fetchpriority="high"></div>
</main>
<div class="start" id="start"><button id="begin" type="button">Enter Vertigo</button></div>
<div class="hint" id="hint">Scroll to descend / swipe up</div>
<footer class="hud"><span>FRAME</span><div class="track"><i id="progress"></i></div><span class="counter" id="counter">01 / 98</span></footer>
<script>
(() => {
  'use strict';
  const TOTAL=98, paths=[];
  [20,20,20,20,18].forEach((count,group)=>{for(let n=1;n<=count;n++)paths.push('../previews/photos/'+(group+1)+'/'+n+'.webp')});
  const current=document.getElementById('current'), next=document.getElementById('next');
  const currentImage=document.getElementById('currentImage'), nextImage=document.getElementById('nextImage');
  const start=document.getElementById('start'), counter=document.getElementById('counter');
  const progress=document.getElementById('progress'), topLabel=document.querySelector('.top span');
  let index=0,busy=false,started=false,lastWheel=0,touchY=0;
  const analyses=new Array(TOTAL), reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  function inspect(img){
    try{
      const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
      c.width=96;c.height=96;ctx.drawImage(img,0,0,96,96);
      const d=ctx.getImageData(0,0,96,96).data, lum=new Float32Array(96*96), sat=new Float32Array(96*96);
      for(let y=0;y<96;y++)for(let x=0;x<96;x++){
        const p=(y*96+x)*4,r=d[p],g=d[p+1],b=d[p+2],i=y*96+x;
        lum[i]=(r*.299+g*.587+b*.114)/255;
        sat[i]=(Math.max(r,g,b)-Math.min(r,g,b))/255;
      }
      const candidates=[];
      const rw=23,rh=25;
      for(let cy=17;cy<=79;cy+=10)for(let cx=17;cx<=79;cx+=10){
        let edge=0,color=0,count=0;
        for(let y=cy-Math.floor(rh/2);y<cy+Math.ceil(rh/2);y+=2)
          for(let x=cx-Math.floor(rw/2);x<cx+Math.ceil(rw/2);x+=2){
            const i=y*96+x;
            edge+=Math.abs(lum[i]-lum[i+1])+Math.abs(lum[i]-lum[i+96]);
            color+=sat[i];count++;
          }
        candidates.push({x:cx/96,y:cy/96,score:edge/count*.78+color/count*.08});
      }
      candidates.sort((a,b)=>a.score-b.score);
      const best=candidates[0]||{x:.5,y:.5};
      return {x:Math.max(.14,Math.min(.86,best.x)),y:Math.max(.16,Math.min(.84,best.y))};
    }catch(e){return{x:.5,y:.5}}
  }
  function load(i){
    if(analyses[i])return Promise.resolve(analyses[i]);
    return new Promise(resolve=>{
      const img=new Image();img.decoding='async';img.onload=()=>{analyses[i]=inspect(img);resolve(analyses[i])};
      img.onerror=()=>{analyses[i]={x:.5,y:.5};resolve(analyses[i])};img.src=paths[i];
    });
  }
  function update(){
    counter.textContent=String(index+1).padStart(2,'0')+' / '+TOTAL;
    progress.style.width=((index+1)/TOTAL*100)+'%';
    topLabel.textContent='VERTIGO / '+String(index+1).padStart(2,'0')+'-98';
  }
  function chooseRect(point){
    const vw=innerWidth,vh=innerHeight;
    const w=Math.min(vw*.27,Math.max(116,vw*.245));
    const h=Math.min(vh*.27,Math.max(112,vh*.245));
    let left=point.x*vw-w/2,top=point.y*vh-h/2;
    left=Math.max(10,Math.min(vw-w-10,left));
    top=Math.max(10,Math.min(vh-h-10,top));
    return {left,top,width:w,height:h};
  }
  async function advance(){
    if(busy||!started)return;
    busy=true;
    const from=index,to=(index+1)%TOTAL;
    const point=await load(to);
    nextImage.src=paths[to];
    next.style.left='0px';next.style.top='0px';next.style.width='100%';next.style.height='100%';
    next.style.opacity='1';current.style.left='0px';current.style.top='0px';current.style.width='100%';current.style.height='100%';
    current.classList.remove('is-shrinking');
    void current.offsetWidth;
    const rect=chooseRect(point);
    const duration=reduced?80:880;
    const frames=[
      {left:'0px',top:'0px',width:innerWidth+'px',height:innerHeight+'px',offset:0},
      {left:(rect.left-2)+'px',top:(rect.top+1)+'px',width:(rect.width+4)+'px',height:(rect.height-2)+'px',offset:.22},
      {left:(rect.left+1)+'px',top:(rect.top-1)+'px',width:(rect.width-2)+'px',height:(rect.height+2)+'px',offset:.43},
      {left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',offset:1}
    ];
    current.classList.add('is-shrinking');
    const animation=current.animate(frames,{duration,easing:reduced?'linear':'steps(9,end)',fill:'forwards'});
    await animation.finished.catch(()=>{});
    index=to;
    currentImage.src=paths[index];
    current.style.left='0px';current.style.top='0px';current.style.width='100%';current.style.height='100%';
    current.classList.remove('is-shrinking');
    nextImage.removeAttribute('src');
    update();busy=false;
    load((index+1)%TOTAL);
  }
  function begin(){
    if(started)return;started=true;start.classList.add('hidden');
    currentImage.src=paths[0];load(0);load(1);
  }
  document.getElementById('begin').addEventListener('click',begin);
  window.addEventListener('wheel',e=>{
    if(!started||e.deltaY<=8)return;
    e.preventDefault();const now=Date.now();if(now-lastWheel>650){lastWheel=now;advance()}
  },{passive:false});
  document.getElementById('stage').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
  document.getElementById('stage').addEventListener('touchend',e=>{if(touchY-e.changedTouches[0].clientY>32)advance()},{passive:true});
  window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();if(!started)begin();else advance()}});
  update();
})();
</script>
</body>
</html>
