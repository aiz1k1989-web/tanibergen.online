<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>VERTIGO / tanibergen.online</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
body{overscroll-behavior:none;touch-action:pan-y}
#stage{position:fixed;inset:0;overflow:hidden;background:#050505;isolation:isolate}
.scene{position:absolute;inset:0;overflow:hidden;background:#050505}
.photo{position:absolute;display:block;object-fit:contain;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:left,top,width,height}
.nested{position:absolute;overflow:hidden;background:#050505;will-change:left,top,width,height}
.nested img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
</style>
</head>
<body>
<main id="stage" aria-label="VERTIGO photographic sequence"><div class="scene" id="scene"></div></main>
<script>
(() => {
'use strict';
const TOTAL=98,stage=document.getElementById('stage');
let scene=document.getElementById('scene'),index=0,busy=false,wheelDebt=0,lastStep=0,touchY=0;
let transitions=Array.from({length:TOTAL},(_,i)=>({from:i+1,to:(i+1)%TOTAL+1,x:50,y:50,w:12,auto:true}));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const paths=[];
[20,20,20,20,18].forEach((count,g)=>{for(let n=1;n<=count;n++)paths.push('../photos/'+(g+1)+'/'+n+'.webp')});
const cache=new Map(),analysisCache=new Map();
function getImage(i){
 i=(i+TOTAL)%TOTAL;
 if(cache.has(i))return cache.get(i);
 const promise=new Promise(resolve=>{
  const img=new Image();img.decoding='async';img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=paths[i];
 });
 cache.set(i,promise);return promise;
}
function trimCache(){
 const keep=new Set([index,(index+1)%TOTAL,(index+2)%TOTAL]);
 for(const key of cache.keys())if(!keep.has(key))cache.delete(key);
}
function fitRect(nw,nh){
 const sw=stage.clientWidth,sh=stage.clientHeight,pad=Math.max(8,Math.min(22,sw*.022,sh*.022));
 const ratio=nw/nh;let w=sw-pad*2,h=w/ratio;
 if(h>sh-pad*2){h=sh-pad*2;w=h*ratio}
 return {left:(sw-w)/2,top:(sh-h)/2,width:w,height:h};
}
function seed(i){const v=Math.sin((i+1)*127.1)*43758.5453;return v-Math.floor(v)}
function analyze(img,i,nextRatio,photoRect){
 if(analysisCache.has(i))return analysisCache.get(i);
 let best=null;
 try{
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
  canvas.width=100;canvas.height=100;ctx.drawImage(img,0,0,100,100);
  const d=ctx.getImageData(0,0,100,100).data;
  const lum=new Float32Array(10000),sat=new Float32Array(10000);
  for(let p=0;p<10000;p++){const k=p*4,r=d[k],g=d[k+1],b=d[k+2];lum[p]=(r*.299+g*.587+b*.114)/255;sat[p]=(Math.max(r,g,b)-Math.min(r,g,b))/255}
  const cfg=transitions[i]||{},seedX=(Number(cfg.x)||50)/100,seedY=(Number(cfg.y)||50)/100;
  const sizes=[7.5,9,10.5,12,13.5,15,16.5];
  for(const width of sizes){
   const height=width/nextRatio/(img.naturalWidth/img.naturalHeight);
   if(height>42)continue;
   for(let cy=Math.max(height/2+2,8);cy<=Math.min(92,100-height/2-2);cy+=4)
    for(let cx=Math.max(width/2+2,8);cx<=Math.min(92,100-width/2-2);cx+=4){
     let sum=0,sum2=0,edge=0,color=0,count=0;
     const x0=Math.floor(cx-width/2),x1=Math.ceil(cx+width/2),y0=Math.floor(cy-height/2),y1=Math.ceil(cy+height/2);
     const stride=Math.max(1,Math.floor(Math.min(width,height)/8));
     for(let y=y0;y<y1;y+=stride)for(let x=x0;x<x1;x+=stride){
      const p=y*100+x,v=lum[p];sum+=v;sum2+=v*v;color+=sat[p];
      edge+=Math.abs(v-lum[p+1])+Math.abs(v-lum[p+100]);count++;
     }
     const mean=sum/count,variance=Math.max(0,sum2/count-mean*mean);
     const texture=edge/count, chroma=color/count;
     const tonePenalty=Math.abs(mean-.43)*.16;
     const seedPenalty=(Math.abs(cx/100-seedX)+Math.abs(cy/100-seedY))*.012;
     const centerPenalty=(Math.abs(cx-50)+Math.abs(cy-50))*.00013;
     const score=texture*.58+Math.sqrt(variance)*.5+chroma*.035+tonePenalty+seedPenalty+centerPenalty;
     if(!best||score<best.score)best={x:cx/100,y:cy/100,w:width/100,score};
    }
  }
 }catch(e){}
 if(!best){const cfg=transitions[i]||{};best={x:(Number(cfg.x)||50)/100,y:(Number(cfg.y)||50)/100,w:(Number(cfg.w)||12)/100}}
 analysisCache.set(i,best);return best;
}
function placeNext(img,nextImg,i){
 const r=fitRect(img.naturalWidth,img.naturalHeight);
 const p=analyze(img,i,nextImg.naturalWidth/nextImg.naturalHeight,r);
 let w=r.width*p.w,h=w/(nextImg.naturalWidth/nextImg.naturalHeight);
 if(h>r.height*.42){h=r.height*.42;w=h*(nextImg.naturalWidth/nextImg.naturalHeight)}
 const cx=r.left+r.width*p.x,cy=r.top+r.height*p.y;
 w=Math.min(w,r.width*.34);h=w/(nextImg.naturalWidth/nextImg.naturalHeight);
 if(h>r.height*.42){h=r.height*.42;w=h*(nextImg.naturalWidth/nextImg.naturalHeight)}
 const left=Math.max(r.left+2,Math.min(r.left+r.width-w-2,cx-w/2));
 const top=Math.max(r.top+2,Math.min(r.top+r.height-h-2,cy-h/2));
 return {left,top,width:w,height:h};
}
function buildScene(i,img,nextImg){
 const holder=document.createElement('div');holder.className='scene';
 const r=fitRect(img.naturalWidth,img.naturalHeight);
 const photo=document.createElement('img');photo.className='photo';photo.alt='';photo.draggable=false;photo.src=paths[i];
 Object.assign(photo.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
 holder.appendChild(photo);
 if(nextImg){
  const box=placeNext(img,nextImg,i),portal=document.createElement('div');portal.className='nested';
  Object.assign(portal.style,{left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px'});
  const inner=document.createElement('img');inner.alt='';inner.draggable=false;inner.src=paths[(i+1)%TOTAL];portal.appendChild(inner);holder.appendChild(portal);
 }
 return holder;
}
function oldPhotoEndRect(photoRect,child){
 const ratio=photoRect.width/photoRect.height,cx=child.left+child.width/2,cy=child.top+child.height/2;
 let w=Math.max(child.width*1.22,child.height*1.22*ratio);
 w=Math.min(w,stage.clientWidth*.24,stage.clientHeight*.24*ratio);
 let h=w/ratio;
 if(w<child.width||h<child.height){w=Math.max(child.width*1.08,child.height*1.08*ratio);h=w/ratio}
 return {left:cx-w/2,top:cy-h/2,width:w,height:h};
}
function animateRect(el,from,to,duration){
 const frames=[0,.18,.38,.62,.82,1].map((t,i)=>({
  left:(from.left+(to.left-from.left)*t)+'px',
  top:(from.top+(to.top-from.top)*t)+'px',
  width:(from.width+(to.width-from.width)*t)+'px',
  height:(from.height+(to.height-from.height)*t)+'px',
  offset:t
 }));
 return el.animate(frames,{duration,easing:reduced?'linear':'steps(12,end)',fill:'forwards'});
}
async function advance(){
 if(busy)return;
 busy=true;
 const from=index,to=(index+1)%TOTAL;
 const current=await getImage(from),next=await getImage(to),following=await getImage((to+1)%TOTAL);
 if(!current||!next){busy=false;return}
 const photo=scene.querySelector('.photo'),portal=scene.querySelector('.nested');
 if(!photo||!portal){busy=false;return}
 const photoRect=fitRect(current.naturalWidth,current.naturalHeight);
 const child={left:parseFloat(portal.style.left),top:parseFloat(portal.style.top),width:parseFloat(portal.style.width),height:parseFloat(portal.style.height)};
 const parentEnd=oldPhotoEndRect(photoRect,child);
 const nextEnd=fitRect(next.naturalWidth,next.naturalHeight);
 const duration=reduced?100:980;
 const oldAnim=animateRect(photo,photoRect,parentEnd,duration);
 const newAnim=animateRect(portal,child,nextEnd,duration);
 await Promise.all([oldAnim.finished.catch(()=>{}),newAnim.finished.catch(()=>{})]);
 oldAnim.cancel();newAnim.cancel();
 index=to;
 const fresh=buildScene(index,next,following);
 scene.replaceWith(fresh);scene=fresh;
 trimCache();
 busy=false;
 getImage((index+2)%TOTAL);
}
function onWheel(e){
 if(e.deltaY<=0)return;
 e.preventDefault();
 wheelDebt+=Math.min(e.deltaY,120);
 const now=performance.now();
 if(wheelDebt>=28&&now-lastStep>420&&!busy){wheelDebt=0;lastStep=now;advance()}
}
stage.addEventListener('wheel',onWheel,{passive:false});
stage.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{const dy=touchY-e.changedTouches[0].clientY;if(dy>22&&performance.now()-lastStep>350){lastStep=performance.now();advance()}},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();advance()}});
async function init(){
 try{
  const res=await fetch('./positions.json',{cache:'no-store'});
  if(res.ok){const data=await res.json();if(Array.isArray(data.transitions)&&data.transitions.length===TOTAL)transitions=data.transitions}
 }catch(e){}
 const first=await getImage(0),second=await getImage(1);
 if(!first)return;
 const initial=buildScene(0,first,second);scene.replaceWith(initial);scene=initial;
 getImage(2);trimCache();
}
window.addEventListener('resize',()=>{if(!busy)location.reload()});
init();
})();
</script>
</body>
</html>
