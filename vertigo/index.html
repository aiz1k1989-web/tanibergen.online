<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>VERTIGO / tanibergen.online</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
body{overscroll-behavior:none;touch-action:pan-y}
#stage{position:fixed;inset:0;overflow:hidden;background:#050505;isolation:isolate}
.scene,.reveal{position:absolute;inset:0;overflow:hidden;will-change:transform;transform-origin:0 0;background:#050505}
.photo{position:absolute;display:block;object-fit:contain;max-width:none;max-height:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.nested{position:absolute;overflow:hidden;background:#050505;pointer-events:none}
.nested img{width:100%;height:100%;display:block;object-fit:contain}
.reveal{z-index:5;overflow:hidden}
.reveal img{position:absolute;display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
@media(prefers-reduced-motion:reduce){.scene,.reveal{transition:none}}
</style>
</head>
<body>
<main id="stage" aria-label="VERTIGO photographic sequence">
 <div class="scene" id="scene"></div>
 <div class="reveal" id="reveal" hidden><img id="revealImage" alt=""></div>
</main>
<script>
(() => {
'use strict';
const TOTAL=98, stage=document.getElementById('stage'), scene=document.getElementById('scene');
let reveal=document.getElementById('reveal'), revealImage=document.getElementById('revealImage');
const paths=[];
[20,20,20,20,18].forEach((count,g)=>{for(let n=1;n<=count;n++)paths.push('../previews/photos/'+(g+1)+'/'+n+'.webp')});
const fallback=Array.from({length:TOTAL},(_,i)=>({from:i+1,to:(i+1)%TOTAL+1,x:50,y:50,w:14}));
let transitions=fallback,index=0,busy=false,lastWheel=0,touchY=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const imageCache=new Map();
function getImage(i){
 const key=((i%TOTAL)+TOTAL)%TOTAL;
 if(imageCache.has(key))return imageCache.get(key);
 const p=new Promise(resolve=>{
  const img=new Image();img.decoding='async';img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=paths[key];
 });
 imageCache.set(key,p);return p;
}
function fitRect(nw,nh){
 const sw=stage.clientWidth,sh=stage.clientHeight,pad=Math.min(24,sw*.025,sh*.025);
 const ratio=nw/nh,availableW=sw-pad*2,availableH=sh-pad*2;
 let w=availableW,h=w/ratio;
 if(h>availableH){h=availableH;w=h*ratio}
 return {left:(sw-w)/2,top:(sh-h)/2,width:w,height:h};
}
function frameRect(cfg,photoRect,nextRatio){
 const w=Math.max(0.055,Math.min(.19,(Number(cfg.w)||14)/100*.58))*photoRect.width;
 const h=w/nextRatio;
 const x=photoRect.left+photoRect.width*(Number(cfg.x??50)/100);
 const y=photoRect.top+photoRect.height*(Number(cfg.y??50)/100);
 return {left:Math.max(photoRect.left,Math.min(photoRect.left+photoRect.width-w,x-w/2)),
 top:Math.max(photoRect.top,Math.min(photoRect.top+photoRect.height-h,y-h/2)),width:w,height:h};
}
function makeScene(i,nextImg){
 const img=document.createElement('img');img.className='photo';img.alt='';img.draggable=false;img.src=paths[i];
 const holder=document.createElement('div');holder.className='scene';holder.appendChild(img);
 const r=fitRect(loadedCurrent.naturalWidth,loadedCurrent.naturalHeight);
 Object.assign(img.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
 if(nextImg){
  const nr=nextImg.naturalWidth/nextImg.naturalHeight;
  const cfg=transitions[i]||fallback[i],box=frameRect(cfg,r,nr);
  const nested=document.createElement('div');nested.className='nested';
  Object.assign(nested.style,{left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px'});
  const nimg=document.createElement('img');nimg.alt='';nimg.draggable=false;nimg.src=paths[(i+1)%TOTAL];nested.appendChild(nimg);holder.appendChild(nested);
  holder._box=box;
 }
 return holder;
}
let loadedCurrent=null;
async function prepareScene(){
 const cur=await getImage(index),next=await getImage((index+1)%TOTAL);
 if(!cur)return;
 loadedCurrent=cur;
 const fresh=makeScene(index,next);
 scene.replaceWith(fresh);fresh.id='scene';
 // Keep a stable reference after replacing the initial scene node.
 window.__vertigoScene=fresh;
}
function activeScene(){return window.__vertigoScene||scene}
function setTransform(el,rect){
 const sx=rect.width/stage.clientWidth,sy=rect.height/stage.clientHeight;
 el.style.transformOrigin='0 0';
 el.style.transform='translate('+rect.left+'px,'+rect.top+'px) scale('+sx+','+sy+')';
}
async function advance(){
 if(busy)return;busy=true;
 const oldIndex=index,newIndex=(index+1)%TOTAL;
 const oldScene=activeScene(),oldImg=oldScene.querySelector('.photo');
 const currentRect=fitRect(loadedCurrent.naturalWidth,loadedCurrent.naturalHeight);
 const next=await getImage(newIndex),following=await getImage((newIndex+1)%TOTAL);
 if(!next){busy=false;return}
 const cfg=transitions[oldIndex]||fallback[oldIndex];
 const target=frameRect(cfg,currentRect,next.naturalWidth/next.naturalHeight);
 reveal.hidden=false;revealImage.src=paths[newIndex];
 Object.assign(reveal.style,{left:target.left+'px',top:target.top+'px',width:target.width+'px',height:target.height+'px',transform:'translateZ(0)'});
 Object.assign(revealImage.style,{left:'0',top:'0',width:'100%',height:'100%'});
 // The incoming photograph grows from the exact embedded frame while the old composition folds away.
 const end=fitRect(next.naturalWidth,next.naturalHeight);
 const sx=end.width/target.width,sy=end.height/target.height;
 const tx=end.left-target.left,ty=end.top-target.top;
 const duration=reduced?120:920;
 const steps=reduced?1:12;
 const easing=reduced?'linear':'steps(12,end)';
 const revealAnim=reveal.animate([
  {left:target.left+'px',top:target.top+'px',width:target.width+'px',height:target.height+'px',offset:0},
  {left:(target.left+tx*.34)+'px',top:(target.top+ty*.34)+'px',width:(target.width+(end.width-target.width)*.34)+'px',height:(target.height+(end.height-target.height)*.34)+'px',offset:.34},
  {left:(target.left+tx*.72)+'px',top:(target.top+ty*.72)+'px',width:(target.width+(end.width-target.width)*.72)+'px',height:(target.height+(end.height-target.height)*.72)+'px',offset:.72},
  {left:end.left+'px',top:end.top+'px',width:end.width+'px',height:end.height+'px',offset:1}
 ],{duration,easing,fill:'forwards'});
 const oldAnim=oldScene.animate([
  {transform:'translate(0px,0px) scale(1,1)',offset:0},
  {transform:'translate('+target.left+'px,'+target.top+'px) scale('+(target.width/stage.clientWidth)+','+(target.height/stage.clientHeight)+')',offset:1}
 ],{duration,easing,fill:'forwards'});
 await Promise.all([revealAnim.finished.catch(()=>{}),oldAnim.finished.catch(()=>{})]);
 oldAnim.cancel();revealAnim.cancel();
 index=newIndex;loadedCurrent=next;
 const fresh=makeScene(index,following);
 oldScene.remove();reveal.replaceWith(fresh);fresh.id='scene';
 // Restore the reveal node for the next transition.
 const newReveal=document.createElement('div');newReveal.className='reveal';newReveal.id='reveal';newReveal.hidden=true;
 const newRevealImg=document.createElement('img');newRevealImg.id='revealImage';newRevealImg.alt='';newReveal.appendChild(newRevealImg);
 fresh.after(newReveal);
 window.__vertigoScene=fresh;
 reveal=newReveal;revealImage=newRevealImg;
 busy=false;
 getImage((index+2)%TOTAL);
}
const originalAdvance=advance;
async function step(){if(busy)return;await originalAdvance()}
function onWheel(e){
 if(e.deltaY<=2)return;e.preventDefault();
 const now=performance.now();if(now-lastWheel<520)return;lastWheel=now;step();
}
stage.addEventListener('wheel',onWheel,{passive:false});
stage.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{if(touchY-e.changedTouches[0].clientY>24)step()},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();step()}});
async function init(){
 try{
  const response=await fetch('./positions.json',{cache:'no-store'});
  if(response.ok){const data=await response.json();if(Array.isArray(data.transitions)&&data.transitions.length===TOTAL)transitions=data.transitions}
 }catch(e){}
 loadedCurrent=await getImage(0);
 if(!loadedCurrent)return;
 const following=await getImage(1);
 const first=makeScene(0,following);scene.replaceWith(first);first.id='scene';window.__vertigoScene=first;
 getImage(2);
}
window.addEventListener('resize',()=>{if(!busy)location.reload()});
init();
})();
</script>
</body>
</html>
