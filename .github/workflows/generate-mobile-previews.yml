name: Generate mobile image previews

on:
  push:
    branches:
      - main
    paths-ignore:
      - "previews/**"
      - "cut-previews/**"
      - "index-main-works.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-image-previews
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image processor
        run: npm install --no-save --no-package-lock sharp

      - name: Generate manifest and previews
        run: node scripts/generate-previews.cjs

      - name: Commit generated manifest and previews
        run: |
          if [ -n "$(git status --porcelain -- index-main-works.js previews cut-previews)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index-main-works.js previews/ cut-previews/
            git commit -m "Generate archive manifest and optimized previews"
            git push
          else
            echo "Manifest and previews are already up to date."
          fi
